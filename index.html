<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Шуточный сайт: крутящиеся фотографии и надпись «Я вертел Даню Маслова». Сделан ради смеха, не всерьёз.">
<title>Я вертел Даню Маслова — шуточный сайт</title>
<style>
  :root{
    --lime:#c8ff00;
    --ink:#07070a;
    --size: clamp(180px, 34vmin, 300px);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--ink);
    color:#fff;
    font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    overflow-x:hidden;
    overflow-y:auto;
  }
  /* свет и сетка на фоне */
  .bg{
    position:fixed; inset:-20%;
    background:
      radial-gradient(closest-side at 50% 45%, rgba(200,255,0,.16), transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 1px, transparent 1px 80px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, transparent 1px 80px);
    pointer-events:none;
  }
  main{
    position:relative;
    min-height: 100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: clamp(18px, 5vh, 56px);
    padding: 24px;
    text-align:center;
  }
  h1{
    margin:0;
    font-size: clamp(30px, 7.4vw, 84px);
    line-height:.88;
    letter-spacing:-.02em;
    text-transform:uppercase;
    font-weight:900;
  }
  h1 span{
    display:block;
    color:var(--lime);
    text-shadow: 0 0 40px rgba(200,255,0,.35);
  }
  h1 em{
    font-style:normal;
    -webkit-text-stroke:2px var(--lime);
    color:transparent;
  }

  /* сцена */
  .stage{
    width:var(--size); height:var(--size);
    perspective: 1100px;
    position:relative;
    margin-bottom: calc(var(--size) * .3);
  }
  .stage::after{ /* отражение под кубом */
    content:"";
    position:absolute; left:50%; bottom:-16px;
    width:70%; height:26px; transform:translateX(-50%);
    background: radial-gradient(closest-side, rgba(200,255,0,.35), transparent);
    filter: blur(6px);
  }
  .cube{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    animation: spin 14s linear infinite;
  }
  @keyframes spin{
    from{ transform: rotateX(-16deg) rotateY(0deg); }
    to  { transform: rotateX(-16deg) rotateY(360deg); }
  }
  .face{
    position:absolute; inset:0;
    border:1px solid rgba(200,255,0,.5);
    border-radius:10px;
    overflow:hidden;
    background: linear-gradient(145deg, #1a1a20, #0d0d11 60%, #22220a);
    display:grid; place-items:center;
    box-shadow: 0 0 30px rgba(0,0,0,.6) inset;
  }
  .face b{ /* заглушка, если фото нет */
    font-size: clamp(28px, 9vmin, 74px);
    letter-spacing:.08em;
    color:var(--lime);
    opacity:.75;
  }
  .face img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .face img:not([src]), .face img[src=""]{ display:none; }

  .note{
    margin:0;
    font-size: clamp(11px, 2.6vw, 14px);
    letter-spacing:.35em;
    text-transform:uppercase;
    color:rgba(255,255,255,.55);
  }
  .joke{
    margin:0;
    font-size: 12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(255,255,255,.32);
  }

  /* подсказка «листай вниз» */
  .hint{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(255,255,255,.4);
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob{ 50%{ transform:translate(-50%, 6px); } }

  /* второй экран: спиннер с фотографией */
  .more{
    position:relative;
    min-height: 100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: clamp(20px, 4vh, 40px);
    padding: 40px 24px;
    text-align:center;
    border-top:1px solid rgba(200,255,0,.18);
  }
  .more h2{
    margin:0;
    font-size: clamp(22px, 4.4vw, 44px);
    line-height:.95; letter-spacing:-.01em; text-transform:uppercase; font-weight:900;
  }
  .more h2 span{ color:var(--lime); }

  /* фиджет-спиннер: три лопасти с подшипниками, в центре фото */
  .fidget{
    --d: clamp(200px, 56vmin, 400px);
    width:var(--d); height:var(--d);
    position:relative;
    animation: turn 2.4s linear infinite;
    filter: drop-shadow(0 0 34px rgba(200,255,0,.22));
    will-change: transform;
  }
  .arm{
    position:absolute; left:50%; top:50%;
    width:29%; height:99%;
    transform: translate(-50%,-50%) rotate(var(--a));
    border-radius:999px;
    background:
      radial-gradient(circle at 35% 25%, rgba(255,255,255,.10), transparent 55%),
      linear-gradient(160deg, #26262d, #0c0c10 70%);
    border:1px solid rgba(200,255,0,.45);
    box-shadow: inset 0 0 24px rgba(0,0,0,.8);
  }
  .arm::after{ /* подшипник на конце лопасти */
    content:"";
    position:absolute; top:2.4%; left:50%;
    width:88%; aspect-ratio:1;
    transform:translateX(-50%);
    border-radius:50%;
    background: radial-gradient(circle at 38% 32%, #41414c, #08080b 72%);
    border:1px solid rgba(200,255,0,.35);
    box-shadow: inset 0 0 10px rgba(0,0,0,.9), 0 0 12px rgba(200,255,0,.15);
  }
  .hub{
    position:absolute; inset:0; margin:auto;
    width:46%; aspect-ratio:1;
    border-radius:50%;
    background: linear-gradient(160deg, #2b2b33, #0a0a0e 72%);
    border:1px solid rgba(200,255,0,.45);
    box-shadow: inset 0 0 22px rgba(0,0,0,.9), 0 0 18px rgba(200,255,0,.12);
    z-index:1;
  }
  .cap{
    position:absolute; inset:0; margin:auto;
    width:34%; aspect-ratio:1;
    border-radius:50%;
    overflow:hidden;
    border:2px solid var(--lime);
    box-shadow: 0 0 26px rgba(200,255,0,.45), inset 0 0 18px rgba(0,0,0,.7);
    z-index:2;
  }
  .cap img{ width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes turn{ to{ transform: rotate(360deg); } }

  .load{
    font-size: clamp(11px, 2.4vw, 13px);
    letter-spacing:.35em; text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  @media (prefers-reduced-motion: reduce){
    .cube{ animation:none; transform: rotateX(-16deg) rotateY(-24deg); }
    .fidget, .hint{ animation:none; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<main>
  <h1>Я вертел <span><em>Даню</em> Маслова</span></h1>
  <div class="stage"><div class="cube" id="cube"></div></div>
  <p class="note">крутится и будет крутиться</p>
  <p class="joke">шуточный сайт · сделан ради смеха, без обид</p>
  <div class="hint">листай вниз ↓</div>
</main>

<section class="more">
  <h2>загружаем <span>маслова</span>…</h2>
  <div class="fidget">
    <div class="arm" style="--a:0deg"></div>
    <div class="arm" style="--a:120deg"></div>
    <div class="arm" style="--a:240deg"></div>
    <div class="hub"></div>
    <div class="cap"><img src="danil_2.jpg" alt="Даня Маслов" loading="lazy"></div>
  </div>
  <p class="load" id="pct">0%</p>
  <p class="joke">шуточный сайт · никогда не догрузится, и это шутка</p>
</section>

<script>
  // имя файла с фото — положи картинку рядом с этим html.
  // хочешь разные фото на гранях — перечисли несколько файлов.
  const photos = ['danil_maslov.jpg'];
  const size = getComputedStyle(document.documentElement).getPropertyValue('--size').trim() || '240px';
  const cube = document.getElementById('cube');

  const faces = [
    ['translateZ(HALFpx)', 0], ['rotateY(90deg) translateZ(HALFpx)', 1],
    ['rotateY(180deg) translateZ(HALFpx)', 2], ['rotateY(-90deg) translateZ(HALFpx)', 3],
    ['rotateX(90deg) translateZ(HALFpx)', 4], ['rotateX(-90deg) translateZ(HALFpx)', 5]
  ];

  function build() {
    const w = document.querySelector('.stage').clientWidth || 240;
    cube.innerHTML = '';
    faces.forEach(([tpl, i]) => {
      const f = document.createElement('div');
      f.className = 'face';
      f.style.transform = tpl.replace('HALF', w / 2);
      const mark = document.createElement('b');
      mark.textContent = 'ДМ';           // заглушка, пока нет фото
      f.appendChild(mark);
      const img = new Image();
      img.alt = '';
      img.onload = () => mark.remove();
      img.onerror = () => img.remove();
      img.src = photos[i % photos.length];
      f.appendChild(img);
      cube.appendChild(f);
    });
  }
  build();
  addEventListener('resize', build);

  // счётчик ползёт вверх и навсегда застревает на 99% — так и задумано
  const pct = document.getElementById('pct');
  let p = 0;
  setInterval(() => {
    p = Math.min(99, p + Math.random() * 6);
    pct.textContent = Math.floor(p) + '%';
  }, 350);
</script>
</body>
</html>
